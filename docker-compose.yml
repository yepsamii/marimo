version: '3.8'

services:
  puku-note:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2718:2718"
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    volumes:
      # Mount notebooks directory for persistence
      - ./notebooks:/app/notebooks
      # Mount data directory for any data files
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2718')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Development version with hot reload
  puku-note-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "2718:2718"
      - "3000:3000"  # Frontend dev server
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=development
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["make", "dev"]
    profiles:
      - dev

volumes:
  notebooks:
  data: